name: Release

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

env:
  TERRAFORM_SRC: src/terraform

jobs:
  discover:
    name: Discover solutions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build solution matrix
        id: modules
        run: |
          matrix=$(
            find "${{ env.TERRAFORM_SRC }}" -mindepth 2 -maxdepth 2 -type d \
              | while read -r module_dir; do
                  [ -f "$module_dir/providers.tf" ] || continue
                  rel="${module_dir#${{ env.TERRAFORM_SRC }}/}"
                  artifact=$(echo "$rel" | tr '/' '-')
                  printf '{"artifact":"%s","path":"%s"}\n' "$artifact" "$module_dir"
                done \
              | jq -s -c 'sort_by(.artifact)'
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.artifact }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.path }}

      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.path }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.path }}

  package:
    name: Package ${{ matrix.artifact }}
    needs: [discover, validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Create artifact archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          (cd "${{ matrix.path }}" && zip -r "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}.zip" . \
            -x '.terraform/*' -x '*.tfstate' -x '*.tfstate.*')

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [discover, validate, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set release metadata
        id: meta
        run: |
          # Version format: YYMM.dd.rev (UTC)
          base="$(date -u +%y%m).$(date -u +%d)"
          base_regex="^v$(echo "$base" | sed 's/\./\\./g')\\.([0-9]+)"
          latest_rev=0

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tag_suffix=""
            name_prefix="Release"
            prerelease="false"
            make_latest="true"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            tag_suffix="-pre"
            name_prefix="Pre-release"
            prerelease="true"
            make_latest="false"
          else
            echo "Unsupported branch for release: ${{ github.ref }}"
            exit 1
          fi

          for tag in $(git tag -l "v${base}.*"); do
            if [[ "$tag" =~ ${base_regex}${tag_suffix}$ ]]; then
              rev="${BASH_REMATCH[1]}"
              if [ "$rev" -gt "$latest_rev" ]; then
                latest_rev="$rev"
              fi
            fi
          done

          version="${base}.$((latest_rev + 1))"
          echo "tag=v${version}${tag_suffix}" >> "$GITHUB_OUTPUT"
          echo "name=${name_prefix} ${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${make_latest}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest == 'true' }}
          generate_release_notes: true
          files: dist/*.zip
